[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Hourly scan — triggers the background function via the internal route.
# The route enqueues/triggers real work in Phase 5.
[functions."scheduled-hourly-scan"]
  schedule = "@hourly"

# Outcome refresh — every 15 minutes.
[functions."scheduled-refresh-outcomes"]
  schedule = "*/15 * * * *"
